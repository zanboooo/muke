<style>
:root{--bg:#07070b;--sf:rgba(255,255,255,.045);--sf2:rgba(255,255,255,.075);--ln:rgba(255,255,255,.11);
--tx:#f4f4f7;--dim:#9a9aab;--pk:#ff2d78;--gr:#33d69f;--am:#ffb020;
--f:'Archivo','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="zh"] body{font-family:'Noto Sans SC','Archivo',system-ui,'Microsoft YaHei',sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
/* ── 氛围层：canvas 光场 + 幕布 ── */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
background:radial-gradient(120% 70% at 50% 0%,transparent 0%,rgba(7,7,11,.55) 45%,rgba(7,7,11,.92) 78%,#07070b 100%)}
.page{position:relative;z-index:2}
/* ── 头 ── */
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(7,7,11,.72);border-bottom:1px solid var(--ln)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;cursor:pointer;transition:opacity .2s}
.logo:hover{opacity:.78}
.logo svg{height:22px;width:auto;flex:none;display:block}
.logo b{font:800 12.5px var(--f);letter-spacing:.15em;color:var(--tx);white-space:nowrap}
/* 窄屏（含 375px）头部会挤：只留 logo 图形，字标让位给经纪人名字 */
@media(max-width:430px){.logo b{display:none}.ref{font-size:10.5px;max-width:34vw;padding:0 10px}}
.hd{display:flex;align-items:center;gap:8px;min-width:0}
/* 经纪人名字框与语言切换：同一高度基准 */
.ref,.lang{height:36px;border:1px solid var(--ln);border-radius:99px;flex:none}
.ref{position:relative;overflow:hidden;display:flex;align-items:center;font:500 11px var(--m);color:var(--dim);padding:0 12px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;min-width:0}
.ref::after{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.30) 50%,transparent 66%);
transform:translateX(-130%);animation:shim 7.2s ease-in-out infinite}
@keyframes shim{0%{transform:translateX(-130%)}30.5%,100%{transform:translateX(130%)}}
.lang{position:relative;display:flex;overflow:hidden;background:rgba(255,255,255,.03)}
/* 胶囊滑块：带回弹的弹性过渡 */
.lang em{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;
background:var(--pk);box-shadow:0 2px 10px -2px rgba(255,45,120,.7);
transition:transform .42s cubic-bezier(.34,1.56,.64,1);will-change:transform}
.lang.zh em{transform:translateX(100%)}
.lang button{position:relative;z-index:1;background:none;border:0;color:var(--dim);
font:600 12px var(--f);padding:0 14px;cursor:pointer;height:100%;min-width:44px;
transition:color .3s ease}
.lang button.on{color:#fff}
/* ── Hero ── */
.hero{padding:44px 0 30px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 11px var(--f);letter-spacing:.2em;text-transform:uppercase;
color:var(--dim);border:1px solid var(--ln);border-radius:99px;padding:7px 14px;background:rgba(255,255,255,.03)}
.eyebrow i{width:6px;height:6px;border-radius:99px;background:var(--gr);font-style:normal;animation:bl 2.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-size:clamp(34px,9vw,58px);font-weight:900;line-height:1.03;letter-spacing:-.035em;margin:18px 0 0}
h1 em{font-style:normal;background:linear-gradient(100deg,#ff2d78,#c96bff 45%,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{display:block;opacity:0;transform:translateY(18px);animation:up .75s cubic-bezier(.2,.7,.2,1) forwards}
h1 span:nth-child(2){animation-delay:.11s}
@keyframes up{to{opacity:1;transform:none}}
.sub{color:var(--dim);margin-top:16px;font-size:16.5px;max-width:50ch;opacity:0;animation:up .75s cubic-bezier(.2,.7,.2,1) .24s forwards}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:26px;opacity:0;animation:up .75s cubic-bezier(.2,.7,.2,1) .34s forwards}
.fact{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:13px;backdrop-filter:blur(8px)}
.fact b{display:block;font:900 23px var(--f);letter-spacing:-.02em;
background:linear-gradient(120deg,#fff,#ffbcd5);-webkit-background-clip:text;background-clip:text;color:transparent}
.fact span{font-size:11.5px;color:var(--dim);line-height:1.35;display:block;margin-top:2px}
h2{font:600 12px var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:34px 0 14px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
/* ── 岗位磨砂玻璃条 ── */
.job{position:relative;border:1px solid var(--ln);border-radius:18px;margin-bottom:11px;overflow:hidden;
background:linear-gradient(135deg,hsla(var(--h),70%,55%,.11),hsla(var(--h),70%,45%,.03));
backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);transition:border-color .25s,transform .25s}
.job::before{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;opacity:.5;
background:conic-gradient(from var(--a,0deg) at 30% 50%,transparent 0deg,hsla(var(--h),85%,62%,.5) 60deg,transparent 130deg,transparent 360deg);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
animation:aur 9s linear infinite}
@keyframes aur{to{--a:360deg}}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.job.on{border-color:hsla(var(--h),80%,60%,.55)}
.job .bar{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;user-select:none;min-height:76px}
.jt{flex:1;min-width:0}
.jt .n{font-weight:700;font-size:17.5px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.jt .n s{text-decoration:none;color:var(--dim);font-size:12.5px;font-weight:400}
/* 岗位剪影：卡片右侧背景里隐约倾斜的职业符号，不抢视线 */
.emb{position:absolute;right:94px;top:50%;width:222px;height:222px;pointer-events:none;
transform:translateY(-50%) rotate(-25deg);opacity:.063;
background-repeat:no-repeat;background-position:center;background-size:contain;
transition:opacity .3s,transform .3s}
.job.on .emb{opacity:.099;transform:translateY(-50%) rotate(-23deg) scale(1.04)}
@media(max-width:430px){.emb{right:82px;width:186px;height:186px}}
/* 头像条：一人一张，排不下的向右渐隐（mask），不显示人数文字 */
.crew{display:flex;align-items:center;margin-top:7px;height:23px;overflow:hidden;
-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);
mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%)}
.crew img{width:22px;height:22px;border-radius:99px;margin-right:-7px;flex:none;
border:1.5px solid rgba(9,9,14,.9);background:hsla(var(--h),35%,22%,1)}
.pay{font:500 13px var(--m);color:hsl(var(--h),75%,72%);white-space:nowrap;flex:none}
/* next 圆钮：环缓慢顺时针转；里面的人物轮廓不转，男女随呼吸周期交替 */
/* 卡片极光背景周期 9s；next 亮度周期 = 9 × 1.3 = 11.7s，与背景永不同频（缓慢错拍） */
.nx{position:relative;width:42px;height:42px;flex:none;border-radius:99px;overflow:hidden;
background:hsla(var(--h),70%,55%,.13);border:1px solid hsla(var(--h),70%,60%,.28);
animation:brt 11.7s ease-in-out infinite}
@keyframes brt{0%,100%{opacity:.40}50%{opacity:.80}}
.nx .ring{position:absolute;inset:-1px;border-radius:99px;
background:conic-gradient(from 0deg,transparent 0deg,hsla(var(--h),90%,72%,.55) 55deg,transparent 120deg,transparent 360deg);
-webkit-mask:radial-gradient(circle,transparent 0 62%,#000 63%);mask:radial-gradient(circle,transparent 0 62%,#000 63%);
animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nx .sil{position:absolute;inset:0;display:block;background-repeat:no-repeat;background-position:center 128%;
background-size:88% auto;opacity:0}
.nx .sil.m{animation:silM 9.2s ease-in-out infinite}
.nx .sil.f{animation:silF 9.2s ease-in-out infinite}
@keyframes silM{0%,42%{opacity:.5}50%,92%{opacity:0}100%{opacity:.5}}
@keyframes silF{0%,42%{opacity:0}50%,92%{opacity:.5}100%{opacity:0}}
/* next 字样：跟着顺时针转（与外环同向同速），常驻 50% 透明 */
.nx u{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none;
font:700 9px var(--f);letter-spacing:.1em;color:hsl(var(--h),85%,90%);text-transform:uppercase;
text-shadow:0 1px 4px rgba(0,0,0,.75);opacity:.5;animation:spin 14s linear infinite}
.job.on .nx{animation:none;opacity:1}
.job.on .nx u{animation:none;opacity:.85}
.urg{font:600 10px var(--f);letter-spacing:.08em;color:var(--am);border:1px solid rgba(255,176,32,.4);
border-radius:99px;padding:2px 7px;text-transform:uppercase}
/* ── 展开区 ── */
.panel{max-height:0;overflow:hidden;transition:max-height .42s cubic-bezier(.3,.8,.3,1)}
.pin{padding:2px 16px 17px;border-top:1px solid var(--ln);margin-top:0}
.jd{color:#c9c9d6;font-size:14.5px;line-height:1.65;margin:14px 0 4px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.tag{font-size:11.5px;color:var(--dim);border:1px solid var(--ln);border-radius:99px;padding:3px 10px;background:rgba(255,255,255,.03)}
.btn{display:block;width:100%;margin-top:14px;border:0;border-radius:13px;cursor:pointer;text-decoration:none;text-align:center;
font:700 15.5px var(--f);padding:15px;min-height:52px;color:#fff;
background:linear-gradient(100deg,hsl(var(--h),75%,52%),hsl(calc(var(--h) + 26),75%,56%));
box-shadow:0 6px 22px -8px hsla(var(--h),80%,50%,.75);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
label{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 6px;font-weight:600;letter-spacing:.01em}
label u{text-decoration:none;color:hsl(var(--h),70%,70%)}
input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--ln);border-radius:12px;color:var(--tx);
font:500 16.5px var(--m);padding:14px 15px;outline:none;min-height:52px;-webkit-appearance:none}
input:focus{border-color:hsl(var(--h),70%,55%);box-shadow:0 0 0 3px hsla(var(--h),70%,55%,.13)}
input::placeholder{color:#5b5b6b;font-size:14px}
.hint{font-size:11.5px;color:#7a7a8c;margin-top:5px;line-height:1.45}
/* ── 三步 ── */
.steps{margin-top:16px;display:grid;gap:9px}
.st{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;cursor:pointer;
background:rgba(255,255,255,.045);border:1px solid var(--ln);text-decoration:none;color:inherit;transition:.18s;min-height:58px}
.st:hover{border-color:hsla(var(--h),70%,60%,.5);background:rgba(255,255,255,.075)}
.st i{width:27px;height:27px;border-radius:99px;flex:none;display:grid;place-items:center;font:700 12px var(--m);font-style:normal;
background:hsla(var(--h),70%,55%,.17);color:hsl(var(--h),80%,78%);border:1px solid hsla(var(--h),70%,60%,.32)}
.st div{flex:1;min-width:0}
.st b{display:block;font-size:14.5px;font-weight:600}
.st span{font-size:11.5px;color:var(--dim)}
.st u{text-decoration:none;font-size:17px;color:var(--dim);flex:none}
.st.done{opacity:.62}
.st.done i{background:rgba(51,214,159,.17);color:var(--gr);border-color:rgba(51,214,159,.35)}
.st.done u::before{content:"✓";color:var(--gr)}
.st.done u{font-size:15px}
.st.wip{border-color:hsla(38,90%,60%,.4);background:rgba(255,176,32,.06)}
.st.wip i{background:rgba(255,176,32,.18);color:var(--am);border-color:rgba(255,176,32,.4)}
.st u em{font-style:normal;font:600 10px var(--f);letter-spacing:.06em;color:var(--am);
border:1px solid rgba(255,176,32,.42);border-radius:99px;padding:3px 8px;white-space:nowrap}
.st.lock{opacity:.34;pointer-events:none}
.fin{margin-top:14px;padding:15px 16px;border-radius:13px;
background:linear-gradient(135deg,rgba(51,214,159,.13),rgba(51,214,159,.04));
border:1px solid rgba(51,214,159,.34)}
.fin b{display:block;font:700 15px var(--f);color:var(--gr);margin-bottom:5px}
.fin span{font-size:12.5px;color:#a8b8b2;line-height:1.6}
.who{display:flex;align-items:center;gap:9px;margin-top:14px;padding:11px 13px;border-radius:12px;
background:rgba(51,214,159,.08);border:1px solid rgba(51,214,159,.22);font-size:13px}
.who b{font-weight:700}.who button{margin-left:auto;background:none;border:0;color:var(--dim);font:500 12px var(--f);cursor:pointer;text-decoration:underline;padding:6px}
/* .ref 是 display:flex、.job 等也带自定义 display —— 都会盖掉浏览器对 [hidden] 的
   默认 display:none。第三次踩这个坑了（agent 的 h2、agent 的链接块、join 的归因徽章），
   所以直接一条兜死：凡是 hidden 就必须不可见。 */
[hidden]{display:none!important}
.err{background:rgba(255,45,120,.1);border:1px solid rgba(255,45,120,.32);color:#ffb3cc;border-radius:12px;padding:12px;font-size:13.5px;margin-top:10px}
.warn{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.34);color:#ffd79a;border-radius:12px;padding:12px;font-size:13.5px;margin-bottom:12px}
.flow{display:grid;gap:0;margin-top:6px}
.fl{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid var(--ln)}
.fl:last-child{border:0}
.fl.now{position:relative}
.fl.now b{color:var(--tx)}
.fl.now i{background:hsla(320,75%,58%,.2);border-color:hsla(320,75%,62%,.55);color:#ffa8ca}
.fl.now i::after{content:"";position:absolute;inset:-5px;border-radius:99px;
border:1px solid hsla(320,75%,62%,.5);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.9}70%,100%{transform:scale(1.5);opacity:0}}
.fl.past i{background:rgba(51,214,159,.16);border-color:rgba(51,214,159,.4);color:var(--gr)}
.fl.past b{color:var(--dim)}
.fl .nowtag{display:inline-block;margin-left:8px;vertical-align:2px;
font:700 9px var(--f);letter-spacing:.14em;text-transform:uppercase;
color:#ffa8ca;border:1px solid hsla(320,75%,62%,.45);border-radius:99px;padding:2px 7px}
.fl i{position:relative;flex:0 0 25px;height:25px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);
display:grid;place-items:center;font:600 11px var(--m);font-style:normal;color:var(--pk)}
.fl b{display:block;font-weight:600;font-size:14.5px}.fl span{color:var(--dim);font-size:13px}
footer{border-top:1px solid var(--ln);margin-top:44px;padding:24px 0 44px;color:var(--dim);font-size:12.5px}
/* 底部：手机 = [工会名 · 地址钮] / [三个链接]，两行都两端顶满；
   桌面 = 工会名独占一行，其下「地址钮 + 三个链接」四者同行等距平铺 */
.fgrid{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
row-gap:20px;column-gap:14px}
.fbrand{font:800 15px var(--f);letter-spacing:.13em;color:var(--tx);flex:0 0 auto;text-decoration:none;transition:opacity .2s}
.fbrand:hover{opacity:.78}
.fbrand i{font-style:normal;background:linear-gradient(100deg,#e4007f,#6d3b85 55%,#1d2088);
-webkit-background-clip:text;background-clip:text;color:transparent}
.brk{flex-basis:100%;height:0;margin:0}
.fbtn,.flink{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
background:none;border:0;padding:0;cursor:pointer;color:var(--dim);
font:500 12px var(--f);text-decoration:none;transition:color .2s;min-height:26px}
.fbtn b{font-weight:500}
/* 星探登录：页脚里唯一的「可点按钮」。刻意做得比 .flink 只重一点点 ——
   这个页面是发给候选人的，入口要能找到，但不能抢戏。无下划线。 */
.sbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
 border:1px solid var(--ln);background:rgba(255,255,255,.03);color:var(--dim);
 font:500 11.5px var(--f);text-decoration:none;transition:color .2s,border-color .2s,background .2s}
.sbtn:hover{color:var(--tx);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.sbtn svg{width:12px;height:12px;fill:currentColor;opacity:.65}
/* 死链页的出口按钮：给候选人一条活路，但要他自己点 —— 不能替他默认跳过去 */
.deadgo{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:12px;
 border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
 color:var(--tx);font:600 13.5px var(--f);text-decoration:none}
.deadgo:hover{background:rgba(255,255,255,.1)}
.flink span{font:500 12px var(--m)}
#fabout span{font-family:var(--f);font-weight:600}
.fbtn:hover,.fbtn.on,.flink:hover{color:var(--tx)}
.fbtn svg,.flink svg{width:12.5px;height:12.5px;fill:currentColor;flex:none;opacity:.6;transition:opacity .2s}
.fbtn:hover svg,.fbtn.on svg,.flink:hover svg{opacity:1}
.fbtn.on b{border-bottom:1px solid hsla(320,72%,64%,.7);padding-bottom:2px}
/* 展开的完整地址：整幅铺满、两端对齐 */
.faddr[hidden]{display:none}
.faddr{display:block;width:100%;margin-top:18px;line-height:1.75;color:#82828f;
font-size:12.5px;text-decoration:none;transition:color .2s;
text-align:justify;text-justify:inter-word}
.faddr:hover{color:var(--tx)}
/* 底部装饰：iframe 按正常比例渲染（宽 × 420），外层只露出下半条并裁掉上部。
   不是把画面压扁——压扁会让人形变形；这里是等比渲染后做窗口裁切。
   顶缘用 mask 渐隐，和页面背景无缝接上，看不出边界。 */

   状态存本机 localStorage（混淆非明文；但同源同设备本就只有候选人自己能读，

var AGENT=(qs.get('a')||qs.get('agent')||'').trim();

var DONE=qs.get('done')||'';           // 表单提交后跳回 ?done=cv|bg|ex 用于自动标记完成

if(!AGENT&&!REF){try{AGENT=localStorage.getItem('muke_agent_name')||'';REF=localStorage.getItem('muke_ref')||'';}catch(e){}}
/* ⛔ 绝不在这里写 localStorage —— 此刻还没 fetch，根本不知道这个码有没有对应文件。
   原先无条件写入的后果：打开一次坏链接 → 坏码被存下 → 之后连不带参数的公开入口
   /join/ 也会从 localStorage 把坏码读回来 → 这台手机永远看不到任何岗位。
   实测复现过：干净手机 10 个岗位 → 开一次 ?a=555 → 回到 /join/ 变 0 个岗位。
   改为「解析成功才写」，见页尾 fetch 的 .then 分支。 */

var SK='muke.v3.'+location.pathname;
function xo(s,k){var o='';for(var i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return o;}
function save(o){try{localStorage.setItem('muke_c',btoa(unescape(encodeURIComponent(xo(JSON.stringify(o),SK)))));}catch(e){}}
/* ⚠ 2026-09-05 修：load 必须是 save 的严格逆运算，原先两者的 xo 位置反了 ——
   save 是 xo → UTF-8 编码 → base64，load 却是 base64 → xo → UTF-8 解码。

   ME 为空 → 从表单跳回来时 markDone 直接 return → **他的进度永远记不上**，

function load(){try{var r=localStorage.getItem('muke_c');if(!r)return null;return JSON.parse(xo(decodeURIComponent(escape(atob(r))),SK));}catch(e){return null;}}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
/* ⚠ norm() 会把中文剥成空串 —— 岗位名是中文，DOM id / 完成状态键必须另用哈希，
   否则 11 个岗位的 id 全部撞成 'pn_'（2026-08-31 实测踩到）。 */
function jkey(s){var h=5381,x=String(s||'');for(var i=0;i<x.length;i++)h=((h*33)^x.charCodeAt(i))>>>0;return 'j'+h.toString(36);}
/* 与 Base 的 WA9 公式同款：剥符号取右 9 位。两边必须一套规则，否则查不到 */
function wa9(s){return String(s).replace(/[+\s\-().]/g,'').replace(/\D/g,'').slice(-9);}

/* ── 校验：印尼实名 + 印尼手机号 ──
   姓名：只允许字母/空格/'/./-（印尼名如 Siti Nur'aini、M. Rizky、Ayu-Wulan）；
        禁数字与符号，至少 2 个词或 ≥3 字母，防「aaa」「测试」这类占位。
   手机：归一成 8xxxxxxxx… 后必须以 8 开头（印尼移动号段），总长 10~13 位；
        排除固话（021/022…）与明显假号（全同、连号）。 */
function checkName(s){
 var v=String(s||'').trim().replace(/\s+/g,' ');
 var core=v.replace(/[ '.\u00b7\-]/g,'');          // 去掉分隔符后的实体字符
 if(core.length<2)return 'e_n_short';
 if(v.length>60)return 'e_n_long';
 if(/\d/.test(v))return 'e_n_digit';
 /* 允许：拉丁字母（含变音）、中文、日文假名、空格与 ' . · -
    ⚠ 不能只允许拉丁——公司有中国籍员工与中文名候选人（2026-08-31 实测被拒） */
 if(!/^[A-Za-z\u00c0-\u024f\u4e00-\u9fff\u3040-\u30ff' .\u00b7\-]+$/.test(v))return 'e_n_char';
 var latin=/^[A-Za-z\u00c0-\u024f' .\u00b7\-]+$/.test(v);
 if(latin&&core.length<3)return 'e_n_short';         // 纯拉丁名至少 3 字母
 if(/^(.)\1+$/.test(core))return 'e_n_fake';        // aaa / 啊啊啊
 return '';}

/* 印尼号码归一：+62 / 62 / 0062 国际前缀，以及 +62 (0) 852… 这种「国际码 + 干线 0」
   同时出现的自动填充格式，都要剥干净，最终必须以 8 开头。
   ⚠ 2026-08-31 实测：iOS 通讯录填出的 +62 (0) 852 86087108 被旧版误判为座机 ——
   旧版只剥一层（要么 62 要么 0），剥不掉 62 后面那个 0。 */
function normPhone(s){
 var d=String(s||'').replace(/\D/g,'');
 d=d.replace(/^00/,'');
 if(/^62/.test(d))d=d.slice(2);
 d=d.replace(/^0+/,'');
 return d;}
function checkPhone(s){
 var raw=String(s||'').replace(/\D/g,'');
 if(!raw)return 'e_p_empty';
 var d=normPhone(s);
 if(!/^8/.test(d))return 'e_p_mobile';              // 印尼手机一律 8 开头
 if(d.length<9)return 'e_p_short';
 if(d.length>12)return 'e_p_long';
 if(/^(\d)\1+$/.test(d))return 'e_p_fake';
 var asc=true,desc=true;
 for(var i=1;i<d.length;i++){if(+d[i]!==+d[i-1]+1)asc=false;if(+d[i]!==+d[i-1]-1)desc=false;}
 if(asc||desc)return 'e_p_fake';
 return '';}
function fmtPhone(s){return '0'+normPhone(s);}       // 统一落库成 08xxxxxxxxxx

/* 报名渠道自动识别（2026-09-02）：社交 App 的内置浏览器会在 UA 里留专有特征，
   候选人和经纪人都不用做任何事。三重保险确保不弄脏数据：
     ① 只认 App 专有特征，referrer 一律不用 —— 它会被短链和跳转页改写，置信度不够
     ② 选项名从 jobs.json 实时来（Lark 里改 emoji/措辞/加渠道都自动适配），不写死
     ③ 必须唯一命中一个选项才用；命中 0 个或 2 个以上一律放弃
   认出来 → formUrl 自动 prefill+hide，候选人看不到这题；
   认不出 → 不传这个字段，题目照常显示由候选人自己选。 */
function detectKanal(){
 var ua=navigator.userAgent||'';
 var RULES=[[/musical_ly|Trill|aweme|BytedanceWebview/i,'TikTok'],
            [/Instagram/i,'Instagram'],
            [/FBAN|FBAV|FB_IAB|FBIOS/i,'Facebook'],
            [/WhatsApp/i,'WhatsApp'],
            [/Telegram/i,'Telegram']];
 var key='';
 for(var i=0;i<RULES.length;i++){if(RULES[i][0].test(ua)){key=RULES[i][1];break;}}
 if(!key)return '';
 var opts=(JOBS&&JOBS.srcOpts)||[],hit=[];
 for(var k=0;k<opts.length;k++)if(opts[k].toLowerCase().indexOf(key.toLowerCase())>=0)hit.push(opts[k]);
 return hit.length===1?hit[0]:'';}

/* 归因码兜底（WO-A98）。公开入口和失效链接都不能把 Ref 留空：
   A05.Ref 的题面写着「terisi otomatis — jangan diubah / 自动填写，请勿修改」，
   可它空着又可编辑 —— 候选人会往里填东西（自己的名字、"—"、或听来的一个码），
   而现有 180 个码全是 4 位大写字母数字，猜中一个就是归因串到别人头上。
   给了值之后 formUrl() 会自动附 hide_，这道题对候选人直接隐藏。

   ⚠ 为什么是两个码而不是一个：巡检①（checks.js）靠「Ref 为空」发现链路故障，
   而 WO-A96 的 B 案让失效链接降级成公开入口。两者若都填 MUKE，空 Ref 会归零，
   巡检就再也看不见「链接批量失效」。所以失效来源单独用 MUKEX，巡检把它一并计入。
   两个码与现有 180 个归因码均无碰撞（2026-09-05 全量核对）；
   它们匹配不到任何 ARef，归A码 公式尾部是 [Ref] 透传，因此原样落地、不计入任何人业绩。 */
var REF_PUBLIC='MX5J';    // 公司直招（张博在 A03 的码，11 岗全覆盖；他不招人不拿佣金，
                          // 历史上的离职移交也都落在这里，所以不另设码 —— 2026-09-05 张博定案）
var REF_BROKEN='MUKEX';   // 由失效链接降级而来（异常信号，巡检① 会盯；不进任何结算）
function refFor(job){
 if(CODES)return CODES.byJob[job]||'';   // ?a= 经纪人多岗位 ／ ?r= 星探单岗位，都走这里
 if(REFFAIL)return '';                   // 网络失败时页面已挡住报名；真被走到也不许假冒归因
 return REFBAD?REF_BROKEN:REF_PUBLIC;}
 /* ⛔ 这里刻意不再有「?r= 原样透传」那条分支：未经查表的码绝不能变成归因。
    旧写法把 URL 里的任意字符串直接当归因码落库，写错一个字就是一条查不出来的假归因，
    而且会绕过巡检①（有值就不算「空」）。现在 ?r= 必须在 data/s/ 里命中才算数。 */
function jidFor(job){var a=(JOBS&&JOBS.jobs)||[];for(var i=0;i<a.length;i++)if(a[i].cn===job)return a[i].jid||"";return "";}
function allowed(job){return CODES?!!CODES.byJob[job]:true;}

(function(){
 var c=document.getElementById('bg'),x=c.getContext('2d'),W,Hh,orbs=[],raf,t0=0;
 var COL=[[255,45,120],[201,107,255],[56,189,248],[255,176,32],[51,214,159]];
 function size(){var s=9;W=Math.max(2,Math.ceil(innerWidth/s));Hh=Math.max(2,Math.ceil(innerHeight/s));c.width=W;c.height=Hh;}
 for(var i=0;i<7;i++)orbs.push({c:COL[i%COL.length],
   a:.00013+i*.000041,b:.000097+i*.000058,p:i*1.7,q:i*2.3,r:.28+(i%3)*.09});
 function draw(ts){
  if(!t0)t0=ts; var T=ts-t0;
  x.globalCompositeOperation='source-over';x.fillStyle='#07070b';x.fillRect(0,0,W,Hh);
  x.globalCompositeOperation='lighter';
  for(var i=0;i<orbs.length;i++){var o=orbs[i];
   var px=(Math.sin(T*o.a+o.p)*.5+.5)*W, py=(Math.sin(T*o.b+o.q)*.5+.5)*Hh*.72;
   var rr=Math.min(W,Hh)*o.r*(1+.14*Math.sin(T*.00021+i));
   var g=x.createRadialGradient(px,py,0,px,py,rr);
   g.addColorStop(0,'rgba('+o.c[0]+','+o.c[1]+','+o.c[2]+',.30)');
   g.addColorStop(.55,'rgba('+o.c[0]+','+o.c[1]+','+o.c[2]+',.09)');
   g.addColorStop(1,'rgba('+o.c[0]+','+o.c[1]+','+o.c[2]+',0)');
   x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,6.2832);x.fill();}
  raf=requestAnimationFrame(draw);}
 function start(){if(!raf)raf=requestAnimationFrame(draw);}
 function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
 size();addEventListener('resize',size,{passive:true});
 document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)start();else{size();draw(0);stop();}
})();

/* 底部装饰：iframe 里的视频自动播放会被浏览器拦（顶层页面不拦，iframe 拦），
   而模块自带的「首次交互补启动」绑在 iframe 内部，可它是 pointer-events:none，永远等不到。
   这里把页面上任意一次交互转发进去，只跑一次。整段 try 包住：
   装饰挂了不许影响业务，删掉 iframe 时这段自己空转、也不会报错。 */
['pointerdown','touchstart','keydown'].forEach(function(ev){
  addEventListener(ev,function(){
    try{ var f=document.querySelector('iframe.crewart');
      if(f&&f.contentDocument) f.contentDocument.querySelectorAll('video')
        .forEach(function(v){ v.play().catch(function(){}); });
    }catch(e){}
  },{once:true,passive:true});
});

 /* 表单提交后跳回 ?done=cv|bg|ex[&j=岗位]：标记完成 → 自动展开该岗位 → 提示下一步。
    岗位优先取 URL 的 j（背调/笔试是按岗位的表单，可以写死），
    没有就回落到本机记的最后一个操作岗位（通用简历表单只有一张，写不了岗位）。 */
 var map={cv:0,bg:1,ex:2,'1':-1};
 if(DONE&&ME){
  var jb='',stp=-1;
  try{jb=localStorage.getItem('muke_lastjob')||'';stp=parseInt(localStorage.getItem('muke_laststep'),10);}catch(e){}
  if(map[DONE]>0)stp=map[DONE];                       // 带 done=bg/ex 时以它为准（向前兼容旧配置）
  /* ⚠ 2026-09-05 张博指出：候选人提交完表单**会跳回本站**（?done=cv|bg|ex），
     所以「填表期间同步改了数据」是真会撞上的。原先这里要求岗位仍在 JOBS.jobs 里
     才标记完成 —— 一旦他填表的十几分钟内该岗位转成「已停止」，就**静默不标记**：
     表单其实提交成功了（数据在 Lark），页面上却显示成没进展，他会重复提交。
     现在改为：无论岗位还在不在都先记下他确实交了，只是文案不同。
     同步 cron 从 2 次加密到 8 次后，撞上的时刻变多，这个洞必须先补。 */
  if(jb&&stp>=0&&stp<=2){
   markDone(jb,stp);                                     // 先记完成，与岗位在不在无关
   var stillOpen=JOBS.jobs.some(function(x){return x.cn===jb;});
   if(stillOpen){toggle(jb);toast(t('done_ok'));}        // 正常路径：展开卡片、提示继续
   else toast(t('done_closed'));                         // 岗位在他填表期间关闭了
  }
 }
}).catch(function(){document.getElementById('jobs').innerHTML='<div class="err">'+t('load_err')+'</div>';});
fetch('../data/manual.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
 MANUAL=d;
 /* 与 paint() 谁先返回不确定，两边都要写一次；REFFAIL/REFBAD 时不写，
    否则死链页会被这条 fetch 把横杠又覆盖成数字（2026-09-05 实测过这个洞）。 */
 if(!REFFAIL&&!REFBAD){
  if(d.staff!=null)document.getElementById('f1').textContent=d.staff;
  if(d.speed!=null)document.getElementById('f3').textContent=d.speed;
 }
}).catch(function(){});
fetch('../data/bench.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
 document.getElementById('fnote').textContent=t('updated')(String(d.stamp||'').slice(0,10));
 /* 隐藏入口：1.2 秒内连点页脚日期 10 次 → 同步状态看板。
    只是「不显眼」，不是「保密」—— data/_status.json 本来就公开可读，所以那里不放敏感内容。 */
 (function(){var el=document.getElementById('fnote'),n=0,last=0;
  el.style.cursor='default';
  el.addEventListener('click',function(){
   var now=Date.now(); if(now-last>1200)n=0; last=now; n++;
   if(n>=7&&n<10)el.style.opacity=String(1-(n-6)*0.15);   // 第 7 下起微微变淡，给点手感
   if(n>=10){n=0;el.style.opacity='';location.href='../status/';}});})();
}).catch(function(){});
if(AGENT){fetch('../data/j/'+encodeURIComponent(norm(AGENT))+'.json?v='+Date.now())
 .then(function(r){if(r.status===404)throw new Error('gone');   // 码不存在，刷新没用
                   if(!r.ok)throw new Error('net');             // 其它 HTTP 错误当网络问题
                   return r.json();})
 .then(function(d){CODES={byJob:d.byJob};REFNAME=d.name;MOVED=d.movedTo||'';REFFAIL=false;REFBAD=false;
  /* ✅ 只有解析成功才写 —— 这是"坏链接永久废掉设备"那个 bug 的正解 */
  try{localStorage.setItem('muke_agent_name',AGENT);}catch(e){}
  showRef();paint();})
 .catch(function(e){
  if(e&&e.message==='gone'){REFBAD=true;
   /* 自愈：把已经被存进来的坏码清掉，这台设备下次打开 /join/ 就恢复正常。
      只在存的就是这个坏码时才删 —— 否则会误伤他之前那条有效的归因。 */
   try{if(localStorage.getItem('muke_agent_name')===AGENT)localStorage.removeItem('muke_agent_name');}catch(e2){}
  }else{REFFAIL=true;}
  showRef();paint();});}
else if(REF){
 /* ?r=<星探码>：查 data/s/<码>.json（生成器出，只含姓名+岗位，公开可读、无业绩）。
    命中 → 单岗位页：把 CODES 设成「只有这一个岗位」，于是 allowed() 只放行它、
           refFor() 只给这个码 —— 整套既有机制原样复用，不需要第二条渲染路径。
           星探一行 = 一个码 = 一个岗位，所以这里天然是单岗，与经纪人的多岗 j/ 不同。
    未命中 → 与 ?a= 失效同样处理：明确报错 + 出口按钮，不展示任何岗位。
           两个入口口径必须一致，否则「哪种链接坏了会怎样」就没人说得清。 */
 fetch('../data/s/'+encodeURIComponent(REF.toLowerCase())+'.json?v='+Date.now())
  .then(function(r){if(r.status===404)throw new Error('gone');
                    if(!r.ok)throw new Error('net');return r.json();})
  .then(function(d){
   CODES={byJob:{}}; if(d.job)CODES.byJob[d.job]=d.ref||REF;
   REFNAME=d.name||'';MOVED='';SCOUT=true;REFFAIL=false;REFBAD=false;
   try{localStorage.setItem('muke_ref',REF);}catch(e){}    // 查通了才存
   showRef();paint();})
  .catch(function(e){
   if(e&&e.message==='gone'){REFBAD=true;
    try{if(String(localStorage.getItem('muke_ref')||'')===REF)localStorage.removeItem('muke_ref');}catch(e2){}
   }else{REFFAIL=true;}
   showRef();paint();});}
/* 🔥 保险丝：动画/字体再慢，2.2s 后强制让内容可见（教训见 STATE 迎新页） */
setTimeout(function(){Array.prototype.forEach.call(document.querySelectorAll('h1 span,.sub,.facts'),function(e){
 e.style.opacity='1';e.style.transform='none';});},2200);
</script></body></html>
